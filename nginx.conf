server {
  listen 80;
  server_name _;

  # Allow multipart VLM uploads (API accepts up to 20MB per image; two files + overhead).
  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API requests to the FastAPI container.
  # `/api/...` on the outside becomes `/...` on the FastAPI service.
  location /api/ {
    client_max_body_size 50M;
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve dataset tiles + labels from a bind mount.
  location ^~ /data/train/images/ {
    alias /data/train/images/;
    access_log off;
    expires 7d;
  }

  location ^~ /data/train/labels/ {
    alias /data/train/labels/;
    access_log off;
    expires 7d;
  }

  # Serve small frontend manifests from `frontend/public/data`.
  location = /data/socal-fire-available-images.json {
    alias /frontend_public/data/socal-fire-available-images.json;
  }

  location = /data/socal-fire-house-conditions.json {
    alias /frontend_public/data/socal-fire-house-conditions.json;
  }

  # Fallback: allow other `/data/...` files from the dataset mount.
  location ^~ /data/ {
    alias /data/;
    access_log off;
    expires 7d;
  }

  # SPA fallback for the React app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

